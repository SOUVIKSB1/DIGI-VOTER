name: Build & Deployment Check

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Verify Backend Server Initialization
        run: |
          python -c "from backend.app import create_app; app = create_app('testing'); print('App initialized successfully!')"

      - name: Build Artifact Verification
        run: |
          test -f frontend/index.html && echo "Frontend bundle verified"
